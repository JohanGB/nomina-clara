[project]
name = "nomina-clara"
version = "0.3.0"
description = "Recargos, horas extra y costo laboral en Colombia con cada peso explicado"
requires-python = ">=3.10"
dependencies = ["holidays>=0.108", "pyyaml>=6"]
[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.package-data]
nomina_clara = ["reglas/*.yaml"]
