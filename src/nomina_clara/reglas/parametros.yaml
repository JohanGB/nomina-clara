    consultado: 2026-11-11
    nota: >-
      Paráfrasis del texto leído (no se obtuvo la cita literal): el descanso compensatorio puede
      darse en otro día laborable de la semana siguiente, o desde el mediodía o la 1 p. m. del
      domingo hasta el mediodía o la 1 p. m. del lunes. Art. 185: el empleador fija con 12 h de
      anticipación la relación del personal que trabaja el domingo. Sin notas de modificación.

