# Cotización por semanas para dependientes que laboran menos de 30 días en el mes con salario
# mensual inferior a 1 SMMLV (Decreto 2616 de 2013, compilado en el Decreto 1072 de 2015).
cotizacion_por_semanas:
  - desde: 2013-11-20
    valor:
      dias_menos_de: 30
      salario_menor_a_smmlv: 1
      tabla:            # [días desde, días hasta, semanas]
        - [1, 7, 1]
        - [8, 14, 2]
        - [15, 21, 3]
        - [22, 29, 4]
      valor_semana_smmlv: 0.25
      subsistemas: [pension, arl, caja_compensacion]
      salud: no_cotiza   # régimen subsidiado o beneficiario del contributivo
      arl_base: smmlv_mensual
    fuente: "Decreto 2616 de 2013 (compilado en el Decreto 1072 de 2015), según la UGPP"
    estado: verificado
    norma: "UGPP, ABC Trabajadores a Tiempo Parcial (2026), que desarrolla el Decreto 1072 de 2015"
    url: "https://www.ugpp.gov.co/wp-content/uploads/2026/02/ABC-Trabajadores-a-Tiempo-Parcial.pdf"
    consultado: 2026-11-11
    cita_textual: "Entre 1 y 7 | Una (1) ... Entre 8 y 14 | Dos (2) ... Entre 15 y 21 | Tres (3) ... Más de 21 y menos de 30 | Cuatro (4)"
    nota: >-
      Verificado contra la guía oficial de la UGPP (fuente de la lista aceptada), NO contra el texto
      del decreto (Función Pública bloqueó la lectura del Decreto 2616). La guía tiene dos
      inconsistencias: dice que la base de ARL es el SMMLV pero su ejemplo usa el IBC por días; y
      la fila de 4 semanas trae $1.720.905 (debería ser 4 × $437.726 = $1.750.904). Se adopta
      ARL sobre 1 SMMLV (lo que dice el texto de la guía). La fecha de inicio (20-nov-2013) no se leyó.
    url_revisar:
      - "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=65326"
      - "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=72173"

piso_proteccion_social:
  - desde: 2023-06-20
    valor: inexequible
    fuente: "Corte Constitucional, Sentencia C-276 de 2021 (art. 193 de la Ley 1955 de 2019)"
    estado: verificado
    norma: "Sentencia C-276 de 2021"
    articulo: "Resuelve, numerales segundo y tercero"
    url: "https://www.corteconstitucional.gov.co/relatoria/2021/c-276-21.htm"
    consultado: 2026-11-11
    cita_textual: "INEXEQUIBLE el artículo 193 de la Ley 1955 de 2019 ... surtirá efectos a partir del 20 de junio de 2023"
    nota: >-
      El Decreto 1174 de 2020 reglamentaba ese artículo; el motor no modela el Piso de Protección
      Social. La Ley 2466 de 2025, art. 34, abre cotización a tiempo parcial para microempresas y
      hogares (pendiente de reglamentación; no modelada).


# ----------------------------------------------------------------- liquidación del contrato (v0.3)

cesantias_base_salario:
  - desde: 1965-09-04
    valor: {meses_sin_variacion: 3, meses_promedio: 12}
    fuente: "CST art. 253 (mod. Decreto 2351 de 1965, art. 17)"
    estado: verificado
    norma: "Código Sustantivo del Trabajo"
    articulo: "253"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=199983"
    consultado: 2026-11-11
    cita_textual: "el último salario mensual devengado por el trabajador, siempre que no haya tenido variación"
    nota: >-
      Base: último salario si no varió en los últimos tres meses; si varió, el promedio de lo devengado
      en el último año de servicios, o en todo el tiempo si es menor de un año. No modificado por la
      Ley 2466 de 2025 (revisado el texto de esa ley).

prima_servicios:
  - desde: 2016-07-07
    valor: {dias_por_anio: 30, pago_primer_semestre: "06-30", pago_segundo_semestre: "12-20"}
    fuente: "CST art. 306 (mod. Ley 1788 de 2016, art. 1)"
    estado: verificado
    norma: "Código Sustantivo del Trabajo"
    articulo: "306"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=199983"
    consultado: 2026-11-11
    cita_textual: "la mitad máximo el 30 de junio y la otra mitad a más tardar los primeros veinte días de diciembre"
    nota: >-
      30 días de salario por año, por todo el semestre trabajado o proporcionalmente al tiempo trabajado.
      Al terminar el contrato se paga la fracción del semestre en curso. Si el salario es variable, el
      proyecto usa el promedio de lo devengado en el semestre (supuesto S19, docs/supuestos.md).

vacaciones_compensacion_proporcional:
  - desde: 2005-11-10
    valor: true
    fuente: "Ley 995 de 2005, art. 1 (deroga el numeral 2 del art. 189 del CST)"
    estado: verificado
    norma: "Ley 995 de 2005"
    articulo: "1 y 2"
    url: "https://normativa.colpensiones.gov.co/colpens/compilacion/docs/ley_0995_2005.htm"
    consultado: 2026-11-11
    cita_textual: "tendrán derecho a que estas se les reconozcan y compensen en dinero proporcionalmente por el tiempo efectivamente trabajado"
    nota: >-
      Desde el 10-nov-2005 ya no se exige que la fracción supere tres meses. Base: último salario
      devengado (CST art. 189, num. 3); si es variable, promedio del último año sin dominicales ni extras
      (art. 192). 15 días hábiles por año (art. 186) se compensan como 15 días de salario por cada 360.

indemnizacion_despido:
  - desde: 2002-12-27
    valor:
      umbral_smmlv: 10
      menos_de_umbral: {primer_anio: 30, por_anio_adicional: 20}
      umbral_o_mas: {primer_anio: 20, por_anio_adicional: 15}
      obra_labor_minimo_dias: 15
      regimen_transitorio_ingreso_antes_de: 1981-01-01
    fuente: "CST art. 64 (mod. Ley 789 de 2002, art. 28)"
    estado: verificado
    norma: "Código Sustantivo del Trabajo"
    articulo: "64"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=199983"
    consultado: 2026-11-11
    cita_textual: "veinte (20) días adicionales de salario sobre los treinta (30) básicos ... y proporcionalmente por fracción"
    nota: >-
      Término fijo: salarios del tiempo que falte para el plazo pactado. Obra o labor: el tiempo que falte
      de la obra, mínimo 15 días. Indefinido: tabla según salario (menos de 10 SMMLV o 10 o más). El
      parágrafo transitorio (10 o más años de servicio al 1-ene-1991) conserva la tabla de la Ley 50 de
      1990 y no se calcula: el sistema avisa. No modificado por la Ley 2466 de 2025 (revisado su texto).

indemnizacion_moratoria:
  - desde: 2002-12-27
    valor: {tope_meses: 24, tope_aplica_si_salario_mayor_a_smmlv: 1}
    fuente: "CST art. 65 (mod. Ley 789 de 2002, art. 29)"
    estado: verificado
    norma: "Código Sustantivo del Trabajo"
    articulo: "65"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=199983"
    consultado: 2026-11-11
    cita_textual: "una suma igual al último salario diario por cada día de retardo, hasta por veinticuatro (24) meses"
    nota: >-
      Desde el mes 25 se deben intereses moratorios a la tasa máxima de libre asignación certificada por la
      Superintendencia; el sistema no los calcula (cambian cada mes) y lo avisa. Parágrafo 2: el tope de
      24 meses solo aplica a quien devenga más de 1 SMMLV; para los demás rige el art. 65 anterior (un
      día de salario por día de retardo, sin tope).

convencion_dias_comerciales:
  - desde: 1950-01-01
    valor: {dias_mes: 30, dias_anio: 360}
    fuente: "Convención de año comercial usada en liquidaciones laborales"
    estado: por_verificar
    nota: >-
      La ley dice "proporcionalmente por fracción de año" sin fijar cómo contar días. El proyecto usa meses
      de 30 días y años de 360 (día 31 = 30; último día de febrero = 30), práctica general en Colombia.
      Supuesto S20 en docs/supuestos.md.
