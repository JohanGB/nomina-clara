    estado: verificado
    norma: "Ley 1 de 1963"
    articulo: "7"
    url: "https://normativa.colpensiones.gov.co/compilacion/docs/ley_0001_1963.htm"
    consultado: 2026-11-11
    cita_textual: "Considérase incorporado al salario, para todos los efectos de liquidación de prestaciones sociales, el auxilio de transporte"
    nota: >-
      Texto leído en el normograma de Colpensiones (entidad pública), sin notas de modificación. Las
      vacaciones no son una prestación social sino un descanso remunerado: por eso el auxilio no entra
      en su base (interpretación usual; no está en el texto de la Ley 1 de 1963). Tampoco es base de
      aportes (no es salario para el IBC).

salario_minimo_proporcional:
