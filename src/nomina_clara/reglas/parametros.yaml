  - desde: 2025-06-25
    valor: 3
    fuente: "CST art. 179, parágrafo 1, modificado por la Ley 2466 de 2025, art. 14"
    estado: verificado
    norma: "Ley 2466 de 2025"
    articulo: "14, parágrafo 1 (modifica el art. 179 CST)"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=260676"
    consultado: 2026-11-11
    cita_textual: "ocasional ... labora hasta dos (2) días de descanso obligatorio, durante el mes calendario ... habitual ... tres (3) o más"
    nota: >-
      Cuenta días de descanso obligatorio (domingos y festivos, parágrafo 2), no solo domingos.
      Antes de la Ley 2466 la Ley 789 de 2002 usaba el mismo umbral contado en domingos (no leído).

# Derechos por trabajar en día de descanso obligatorio, según el caso.
derechos_trabajo_dominical:
  - desde: 1990-01-01
    valor:
      ocasional: eleccion_trabajador     # recargo en dinero O descanso compensatorio remunerado
      habitual: recargo_y_compensatorio  # recargo en dinero Y descanso compensatorio remunerado
    fuente: "CST arts. 180 y 181 (subrogados por la Ley 50 de 1990, arts. 30 y 31)"
    estado: verificado
    norma: "Ley 50 de 1990"
    articulo: "30 (art. 180 CST) y 31 (art. 181 CST)"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=281"
    consultado: 2026-11-11
    cita_textual: "tiene derecho a un descanso compensatorio remunerado, o a una retribución en dinero"
    nota: >-
      Art. 180 (excepcional/ocasional): compensatorio O dinero, a elección del trabajador.
      Art. 181 (habitual): compensatorio remunerado "sin perjuicio de la retribución en dinero"
      del art. 180 (paráfrasis del texto leído). La Ley 2466 de 2025 no modificó los arts. 180-185
      (revisado en su texto). En la jornada de 36 h (turnos sucesivos) solo hay compensatorio si
      se trabaja en domingo: no modelado.

