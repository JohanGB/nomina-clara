    articulo: "147"
    url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma_pdf.php?i=199983"
    consultado: 2026-11-11
    cita_textual: "en proporción al número de horas efectivamente trabajadas"
    nota: "Aplica a jornadas inferiores a la máxima legal. Notas: Ley 50 de 1990 art. 19; Ley 278 de 1996."

dominical_proporcional_jornada_incompleta:
  - desde: 1990-12-28
    valor: true
    fuente: "CST art. 173, num. 5 (subrogado por la Ley 50 de 1990, art. 26)"
    estado: verificado
    norma: "Ley 50 de 1990"
