# Factor del divisor mensual del valor hora: divisor = jornada semanal × factor.
# 30 días / 6 días laborables = 5  → 48 h × 5 = 240; 42 h × 5 = 210.
factor_divisor_hora_mensual:
  - desde: 1990-01-01
    valor: 5
    fuente: "Práctica de liquidación (48 h × 5 = 240) y conceptos del Ministerio del Trabajo sobre la Ley 2101"
    estado: por_verificar
    nota: >-
      No es un valor legal expreso: la Ley 2101 y la Ley 2466 no fijan divisor (leído en ambas el
      2026-11-11). El concepto del Ministerio del Trabajo no se pudo abrir (robots.txt del sitio).
    url_revisar:
      - "https://www.mintrabajo.gov.co/documents/20147/74864900/05EE2023120300000060943+++REDUCCI%C3%93N+JORNADA++-TURNOS+DE+TRABAJO.pdf/0be54879-6e2f-a25f-a0cb-29b5c0668437?t=1699972896395&download=true"

