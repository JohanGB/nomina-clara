# Reglas versionadas de Nómina Clara (v0.2).
#
# Cada versión de una regla tiene:
#   desde        fecha (inclusive) desde la que rige el valor
#   valor        número, texto o tabla
#   fuente       norma en texto corto (se imprime en cada cita)
#   estado       "verificado"   = valor y vigencia leídos en el texto oficial (fuente primaria)
#                                 en la fecha `consultado`, y coinciden.
#                "por_verificar" = no se pudo leer el texto oficial en esta sesión; ver
#                                 `url_revisar` y docs/verificacion_reglas.md.
# Campos de trazabilidad (opcionales):
#   norma, articulo, url (texto oficial leído), consultado (AAAA-MM-DD),
#   cita_textual (fragmento literal corto), nota, url_revisar (dónde verificar).
#
# Nada de este archivo es asesoría jurídica.

